llm_provider: openai
llm_api_key: "sk-***redacted***"
llm_base_url: https://api.openai.com/v1
llm_model: gpt-4-vision-preview
llm_temperature: 0.1

render_dpi: 150
max_workers: 3
libreoffice_path: soffice
pdftoppm_path: pdftoppm

# Vector Database Configuration
vectordb_enabled: false                  # Set to true to enable vector DB integration
vectordb_provider: chroma                # Vector database provider (currently only chroma)
vectordb_persist_dir: ./chroma_db        # Local persistence directory
vectordb_collection_name: project_slides # Collection name

# Embedding Configuration
embedding_model: moka-ai/m3e-base        # HuggingFace model ID (m3e-base or m3e-large)
embedding_device: cpu                    # Device: cpu | cuda | mps (Apple Silicon)
embedding_batch_size: 32                 # Batch size for embedding generation
embedding_cache_dir: ./models            # Model cache directory

# RAG generation mode
auto_ragprep_enabled: false              # 默认关闭自动 RAG 生成，需按 docs/generate_rag_documents.md 手工产出 rag_documents.json

# RAG feature toggles (cost/回滚保护)
enable_llm_classify: false               # 是否调用 LLM 分类 QA 对
enable_topic_chunks: false               # 是否生成 topic chunk
enable_step_chunks: false                # 是否生成 step chunk
enable_metrics_chunks: false             # 是否生成 metrics chunk

# QA monitoring & cache
qa:
  monitor:
    monitor_enabled: true
    monitor_sample_rate: 1.0
    log_dir: logs/qa_sessions
  cache:
    cache_enabled: true
    cache_sample_rate: 1.0
    cache_ttl_days: 7
    cache_backend: jsonl                 # jsonl | sqlite (sqlite reserved)
    cache_semantic_enabled: false        # semantic cache removed; keep false
    cache_semantic_threshold: 0.9        # reserved (ignored when semantic cache disabled)
    cache_collection: qa_cache           # reserved
    cache_persist_dir: ./chroma_db       # reserved
    vectordb_version: v1
  guided:
    enabled: true
    engine: langgraph                    # langgraph (legacy not implemented yet)
    suggestion_count: 3
    templates_path: src/prompts/guided_templates.yaml
    gap_similarity_threshold: 0.5
    llm_prompt_path: src/prompts/guided_llm.txt
