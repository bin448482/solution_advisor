gap_prompts:
  - "您可以补充项目名称，例如：ChatBI 的 XXX"
  - "您想了解哪个阶段？立项 / 实施 / 收尾"
  - "您关注哪个方面？功能 / 架构 / 部署 / 案例"

follow_ups_by_module:
  product_overview:
    - "需要更清晰的产品定位和差异化说明吗？"
    - "想了解面向的典型用户或业务部门吗？"
  architecture:
    - "想看总体技术架构或部署形态（云/私有化/混合）吗？"
    - "需要了解核心技术栈或集成方式吗？"
  core_features:
    - "想进一步了解核心功能清单或关键能力演示吗？"
    - "需要知道哪些功能最能解决你当前的场景吗？"
  analytics_capability:
    - "想了解数据分析/自助报表/可视化的能力和限制吗？"
    - "需要看看支持的指标口径或多维分析方式吗？"
  security_and_governance:
    - "需要安全、合规、权限或审计方面的细节吗？"
    - "想知道数据隔离/权限模型/日志留痕如何实现吗？"
  use_cases:
    - "想听听典型落地案例或行业场景匹配吗？"
    - "需要按你的业务场景给出对标案例吗？"
  roadmap_or_future:
    - "想了解后续版本规划或在研能力吗？"
    - "需要知道近期迭代的重点方向吗？"
  default:
    - "需要更聚焦产品定位、架构还是核心功能？"
    - "还有其他细化问题吗？我可以按场景补充。"

# 槽位澄清模板（阶段 2）
slot_schema:
  project_name:
    prompt: "请问您想了解哪个项目？"
    required: false
  phase:
    prompt: "您关注哪个阶段？"
    options: ["立项", "实施", "收尾"]
  module:
    prompt: "您关注哪个方面？"
    options: ["功能", "架构", "部署", "案例", "风险"]
