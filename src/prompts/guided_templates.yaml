gap_prompts:
  - "您可以补充项目名称，例如：ChatBI 的 XXX"
  - "您想了解哪个阶段？立项 / 实施 / 收尾"
  - "您关注哪个方面？功能 / 架构 / 部署 / 案例"

follow_ups_by_module:
  architecture:
    - "想了解部署方式吗？"
    - "需要查看技术栈详情吗？"
  features:
    - "想看具体的功能演示吗？"
    - "需要了解使用场景吗？"
  deployment:
    - "想了解性能指标吗？"
    - "需要查看集成方式吗？"
  default:
    - "还有其他问题吗？"
    - "需要更详细的说明吗？"

# 槽位澄清模板（阶段 2）
slot_schema:
  project_name:
    prompt: "请问您想了解哪个项目？"
    required: false
  phase:
    prompt: "您关注哪个阶段？"
    options: ["立项", "实施", "收尾"]
  module:
    prompt: "您关注哪个方面？"
    options: ["功能", "架构", "部署", "案例", "风险"]
